<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NoteIt</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/login.css">
</head>
<body>

  <div class="box">
    <h2>Login</h2>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="123@gmail.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password">

    <div class="row">
      <label class="checkbox-container">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="#" onclick="forgotPassword(event)">Forgot password?</a>
    </div>

    <button onclick="login()">Sign In</button>
    
    <p class="msg" id="msg"></p>
  
    <p class="bottom">
      Don't have an account? <a href="#">Sign up</a>
    </p>
  </div>

  <script src="script/login.js"></script>

</body>
</html>
