<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NoteIt</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/login.css">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <nav>
        <a href="../index.html" class="NIT-logo">
            <img src="../assets/logo.svg" alt="" height="75" width="75"><span>Note-IT</span>
        </a>

        <ul class="pages">
            <li><a href="../index.html">Home</a></li>
            <li class="page">
                <a href="#">Courses <img src="../assets/sort-up.svg" alt="" height="10" width="10"></a>
                <div class="dropdown">
                    <div class="dropdown-items">
                        <a href="bcsit.html">BCSIT</a>
                        <a href="bba.html">BBA</a>
                    </div>
                </div>
            </li>
            <li><a href="course_details.html">Course Details</a></li>

            <li><a href="college.html">Colleges</a></li>
            <li><a href="scholar.html">Scholarship</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>

        <div class="login-signup-btn">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>

        <div class="profile" style="display: none;">
            <div class="full-profile">
                <span id="profile-icon"></span>
                <span id="user-profile"></span>
            </div>
            <div class="logout">
                <div class="logout-inner">
                    <img src="../assets/logout.svg" alt="" height="20" width="20">
                    <a href="#" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>

        <div class="menu-responsive">
            <button><img src="../assets/menu.svg" alt="" height="25" width="25"></button>
            <div class="menu-dropdown">
                <div class="menu-items">
                    <a href="../index.html">Home</a>
                    <a href="bcsit.html">BCSIT</a>
                    <a href="bba.html">BBA</a>
                    <a href="college.html">Colleges</a>
                    <a href="scholar.html">Scholarship</a>
                    <a href="course_details.html">Course Details</a>
                    <a href="contact.html">Contact Us</a>
                    <a href="signup.html">Sign Up</a>
                    <a href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

  <div class="box">
    <h2>Login</h2>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="123@gmail.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password">

    <div class="row">
      <label class="checkbox-container">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="#" onclick="forgotPassword(event)">Forgot password?</a>
    </div>

    <button onclick="login()">Sign In</button>
    
    <p class="msg" id="msg"></p>
  
    <p class="bottom">
      Don't have an account? <a href="signup.html">Sign up</a>
    </p>
  </div>

  
  <footer>© 2026 Note-IT | PU Resource Hub</footer>
  <script src="../script/login.js"></script>
  <script src="../script/auth.js"></script>
</body>
</html>
