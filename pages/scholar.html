<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship</title>
    <link rel="stylesheet" href="../style/college&scholar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

    <nav>
        <a href="../index.html" class="NIT-logo">
            <img src="../assets/logo.svg" alt="" height="75" width="75"><span>Note-IT</span>
        </a>
        <ul class="pages">
            <li><a href="../index.html">Home</a></li>
            <li class="page">
                <a href="#">Courses</a>
                <div class="dropdown">
                    <div class="dropdown-items">
                        <a href="bcsit.html">BCSIT</a>
                        <a href="bba.html">BBA</a>
                    </div>
                </div>
            </li>
            <li><a href="college.html">College</a></li>
            <li><a href="scholar.html">Scholarship</a></li>
        </ul>
        <div class="login-signup-btn">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>
    </nav>

    <div class="container">
        
        <div class="header">
            <h1>Find <span>Scholarships</span></h1>
            <p>Browse government, private, and merit-based schemes for PU undergraduates.</p>
        </div>

        <div class="filters-bar">
            <div class="search-box">
                <img src="../assets/search.svg" alt="" height="20" width="20">
                <input id="search-input" type="text" placeholder="Search scholarships…" oninput="filterScholarships()">
            </div>

            <select id="type-filter" class="filter-dropdown" onchange="filterScholarships()">
                <option value="">All Types</option>
                <option value="Government">Government</option>
                <option value="Private">Private</option>
                <option value="Merit-Based">Merit-Based</option>
            </select>

            <select id="course-filter" class="filter-dropdown" onchange="filterScholarships()">
                <option value="">All Courses</option>
                <option value="BBA">BBA</option>
                <option value="BCSIT">BCSIT</option>
            </select>
        </div>
        
        <div id="results-count" class="results-count"></div>
        <div id="scholarship-grid" class="cards-grid"></div>

    </div>

    <footer>
        © 2026 Note-IT | PU Resource Hub
    </footer>

    <script src="../script/scholarship.js"></script>
</body>
</html>
